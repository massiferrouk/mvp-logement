version: "3.9"

services:
  db:
    image: postgres:16
    container_name: mvp-logement-db
    environment:
      POSTGRES_DB: alternup
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: projetrncp
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend/mvp-logement-api
      dockerfile: Dockerfile
    container_name: mvp-logement-api
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/alternup
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: projetrncp
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"

volumes:
  db_data:

